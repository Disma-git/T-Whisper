[package]
name = "t-whisper"
version = "0.2.1"
edition = "2021"
description = "Push-to-talk-transkribering för Windows 11 på svenska (KB-Whisper + whisper.cpp)"
license = "MIT"
repository = "https://github.com/Disma-git/T-Whisper"

[features]
default = []
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
anyhow = "1"
arboard = "3"
cpal = "0.15"
dirs = "5"
enigo = "0.2"
global-hotkey = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tao = "0.30"
toml = "0.8"
tray-icon = "0.19"
whisper-rs = "0.16"

[profile.release]
lto = true
codegen-units = 1
strip = true
