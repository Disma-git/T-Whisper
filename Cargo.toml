[package]
name = "t-whisper"
version = "0.5.3"
edition = "2021"
description = "Push-to-talk-transkribering för Windows 11 på svenska (KB-Whisper + whisper.cpp)"
license = "MIT"
repository = "https://github.com/Disma-git/T-Whisper"
build = "build.rs"

[features]
default = []
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
anyhow = "1"
arboard = "3"
cpal = "0.15"
dirs = "5"
enigo = "0.2"
global-hotkey = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.30"
toml = "0.8"
tray-icon = "0.19"
whisper-rs = { version = "0.16", features = ["log_backend"] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
